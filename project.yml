name: ShotFinder
options:
  bundleIdPrefix: com.vault
  deploymentTarget:
    iOS: "17.0"
targets:
  ShotFinder:
    type: application
    platform: iOS
    sources:
      - App
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vault.shotfinder
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ShotFinder
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: ShotFinder uses the camera to take photos and scan the scene.
        NSPhotoLibraryAddUsageDescription: ShotFinder saves the photos you take to your library.
