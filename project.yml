name: ShotFinder
options:
  bundleIdPrefix: com.vault
  deploymentTarget:
    iOS: "26.0"
targets:
  ShotFinder:
    type: application
    platform: iOS
    sources:
      - App
    scheme:
      testTargets:
        - ShotFinderTests
        - ShotFinderUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vault.shotfinder
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ShotFinder
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: ShotFinder uses the camera to take photos and scan the scene.
        NSPhotoLibraryAddUsageDescription: ShotFinder saves the photos you take to your library.
  ShotFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: Tests/sample.jpg
        buildPhase: resources
    dependencies:
      - target: ShotFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.vault.shotfinder.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  ShotFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ShotFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.vault.shotfinder.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
