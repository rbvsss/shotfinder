name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Run tests on a simulator
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro \(' | sed -E 's/^ *(.*) \(([0-9A-F-]+)\).*/\2/')
          mkdir -p /tmp/shotfinder-screens
          xcodebuild test \
            -project ShotFinder.xcodeproj \
            -scheme ShotFinder \
            -destination "id=$device" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShotFinder-screens
          path: /tmp/shotfinder-screens
          if-no-files-found: warn
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ShotFinder.xcodeproj \
            -scheme ShotFinder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ShotFinder.app Payload/
          zip -qry ShotFinder.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShotFinder-ipa
          path: ShotFinder.ipa
          if-no-files-found: error
